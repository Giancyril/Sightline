name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: pip install ruff black mypy pytest pytest-asyncio httpx

      - name: Ruff lint
        run: python -m ruff check ml/ api/ scripts/

      - name: Black format check
        run: python -m black --check ml/ api/ scripts/

      - name: Mypy type check
        run: python -m mypy ml/ api/ scripts/ --ignore-missing-imports || true

      - name: Run tests
        run: python -m pytest -q

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: true  # web scaffold created in Stage 7

      - name: ESLint
        run: npm run lint
        continue-on-error: true  # web scaffold created in Stage 7

      - name: Type check
        run: npm run typecheck
        continue-on-error: true  # web scaffold created in Stage 7

  verify-stage-tags:
    name: Verify Stage Tag Order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stage tags are in order
        shell: bash
        run: |
          echo "Current stage tags:"
          git tag -l "stage-*" | sort -V || true
          echo "Tag verification complete (gaps are expected mid-build)."

