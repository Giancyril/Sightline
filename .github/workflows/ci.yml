name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test-python:
    name: Python Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn pydantic python-multipart pillow numpy pyyaml

      - name: Ruff Lint
        run: python -m ruff check ml/ api/ scripts/

      - name: Ruff Format Check
        run: python -m ruff format --check ml/ api/ scripts/

      - name: Setup Node.js (for frontend bundle SLA validation)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        run: |
          cd web
          npm ci
          npm run build

      - name: Run Full Test Suite
        run: python -m pytest -q

  frontend-build-and-lint:
    name: Frontend Lint & Build (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: TypeScript & Vite Build
        run: npm run build

  verify-stage-tags:
    name: Verify Stage Tag Order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stage tags are in order
        shell: bash
        run: |
          echo "Current stage tags in repository:"
          git tag -l "stage-*" | sort -V
          echo "Verification complete."
